[project]
name = "nhs-nearby-api"
version = "0.1.0"
description = "FastAPI + DuckDB backend for scotland-nhs-nearby: nearest GP, pharmacy, dentist, A&E and hospital from NHS Scotland open data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "palademian-jose" }]
dependencies = [
    "duckdb>=1.3.0",
    "fastapi>=0.115.0",
    "anthropic>=0.40.0",
    "httpx>=0.28.1",
    "openai>=1.60.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "uvicorn[standard]>=0.34.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
nhs-ingest = "nhs_nearby.ingest.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.9.0"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "N", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv.build-backend]
module-name = "nhs_nearby"

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"tests/test_golden.py" = ["E402"]
