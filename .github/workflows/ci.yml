name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  LLM_PROVIDER: fake

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Test
        run: uv run pytest -q
      - name: Golden-set eval (fake provider) and gate
        run: uv run python scripts/eval.py --gate ../../evals.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/eval.json

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Lint (ESLint and Prettier)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Jest
        run: npm test -- --ci
      - name: Web build check
        run: npx expo export --platform web
      - uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: apps/mobile/dist
